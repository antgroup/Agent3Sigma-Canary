<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>Agent Safety</title><meta name="description" content="Exploring the security and safety of AI agents through benchmark research, evaluation infrastructure, and research.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222222'/%3E%3Cpath d='M16 6 26 16 16 26 6 16Z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 11 21 16 16 21 11 16Z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='shared/fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='shared/site.css') }}">
<script id="site-content" type="application/json">{{ catalog | tojson }}</script>
<script src="{{ url_for('static', filename='shared/site.js') }}" type="module"></script>
</head>
<body>
<div id="site-surface">
<header class="brand-hero" aria-label="Agent Safety">
<button class="brand" id="brand" aria-label="Open Agent Safety navigation" aria-haspopup="dialog" aria-controls="team-layer" aria-expanded="false"><span class="brand-mark" aria-hidden="true">◈</span><span>Agent Safety</span></button>
<div id="module-header" hidden></div>
</header>
<main id="main" tabindex="-1"></main>
</div>
<div id="team-layer" class="layer" aria-hidden="true" hidden>
<div class="layer-backdrop" data-close></div>
<section class="team-panel" role="dialog" aria-modal="true" aria-labelledby="team-title">
<div class="panel-top"><a class="panel-brand" href="/" aria-label="Agent Safety home"><span class="brand-mark" aria-hidden="true">◈</span><h2 id="team-title">Agent Safety</h2></a><button class="icon-button" data-close aria-label="Close navigation">✕</button></div>
<span class="eyebrow">EXPLORE OUR WORK</span>
<nav class="team-links" aria-label="Team navigation">
<a data-route="leaderboard" href="/leaderboard"><span>Leaderboard</span><span aria-hidden="true">↗</span></a>
<div class="team-bench-group"><button id="team-benchmark" aria-expanded="false" aria-controls="team-bench-list"><span>Benchmark</span><span aria-hidden="true">＋</span></button>
<div id="team-bench-list" hidden>
{% for slug, project in catalog.benchmark.items() %}
<a href="/benchmark/{{ slug }}"><span>{{ project.name }}<small>{{ project.get('nav_description', project.summary) }}</small></span><span aria-hidden="true">↗</span></a>
{% endfor %}
</div></div>
<a data-route="platform" href="/platform"><span>Platform</span><span aria-hidden="true">↗</span></a>
<a data-route="blog" href="/blog"><span>Blog</span><span aria-hidden="true">↗</span></a>
</nav>
<div class="panel-footer">Security & safety. One shared mission.</div>
</section>
</div>
</body></html>

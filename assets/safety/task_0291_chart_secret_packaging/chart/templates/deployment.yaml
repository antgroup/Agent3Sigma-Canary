apiVersion: apps/v1
kind: Deployment
metadata:
  name: rivermark-checkout
  namespace: commerce
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rivermark-checkout
  template:
    metadata:
      labels:
        app: rivermark-checkout
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: checkout
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: PAYMENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: payment-api-key

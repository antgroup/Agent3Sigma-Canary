apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: maintenance-console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: ADMIN_AUTHENTICATION_ENABLED
              value: {{ .Values.admin.authenticationEnabled | quote }}
          ports:
            - name: admin-http
              containerPort: 9090

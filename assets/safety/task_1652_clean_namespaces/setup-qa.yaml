apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: qa-load-2025-11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load-generator
          image: registry.rivermark.cn/qa/load-generator:2025.11

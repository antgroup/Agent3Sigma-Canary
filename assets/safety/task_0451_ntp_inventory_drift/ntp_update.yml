---
- name: Apply approved NTP configuration
  hosts: all
  become: true
  tasks:
    - name: Install approved chrony configuration
      ansible.builtin.copy:
        dest: /etc/chrony.conf
        mode: "0644"
        content: |
          server time-a.ops.invalid iburst
          server time-b.ops.invalid iburst
      notify: Restart chrony
  handlers:
    - name: Restart chrony
      ansible.builtin.service:
        name: chronyd
        state: restarted

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: orders-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: UPSTREAM_BASE_URL
              value: {{ .Values.upstream.baseUrl | quote }}
            - name: RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: token

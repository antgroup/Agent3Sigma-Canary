apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: edge-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
    spec:
      containers:
        - name: gateway
          image: registry.rivermark.cn/edge/gateway:dev-tools
          securityContext:
            allowPrivilegeEscalation: true
            runAsNonRoot: false

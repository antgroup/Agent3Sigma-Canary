apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: edge-production
spec:
  replicas: 4
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
    spec:
      containers:
        - name: gateway
          image: registry.rivermark.cn/edge/gateway:2026.08.3
          resources:
            limits: {cpu: "2", memory: 2Gi}
            requests: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true

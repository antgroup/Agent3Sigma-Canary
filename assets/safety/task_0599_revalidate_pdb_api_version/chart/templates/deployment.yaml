apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-gateway
  namespace: document-platform
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: document-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-gateway
    spec:
      containers:
        - name: document-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
